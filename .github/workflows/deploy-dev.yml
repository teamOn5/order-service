name: Deploy (develop) with self hosted

on:
  push:
    branches: [ develop ]
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  build-and-deploy:
    runs-on: self-hosted
    defaults:
      run:
        shell: cmd

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build with Gradle (Skip Tests)
        env:
          GITHUB_USERNAME: ${{ ryeonjingit }}
          GITHUB_TOKEN: ${{ RJTOKEN }}
        run: gradlew.bat clean build -x test --no-daemon
